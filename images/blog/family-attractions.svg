  <text x="120" y="59" fill="#c5a880" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">FAMILY TRAVEL</text>
  <text x="400" y="420" fill="#ffffff" font-family="'Playfair Display', serif" font-size="30" font-weight="600" text-anchor="middle">Memorable Adventures for All Ages</text>
