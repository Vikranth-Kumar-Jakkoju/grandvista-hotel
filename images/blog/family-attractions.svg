      <stop offset="0%" stop-color="#192026"/>
      <stop offset="60%" stop-color="#24333d"/>
      <stop offset="100%" stop-color="#3d5a6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg5)"/>
  <!-- Ferris wheel / Carousel Silhouette -->
  <circle cx="400" cy="200" r="90" fill="none" stroke="#c5a880" stroke-width="2.5"/>
  <circle cx="400" cy="200" r="14" fill="#c5a880"/>
