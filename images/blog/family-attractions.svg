  <!-- Cabins -->
  <circle cx="400" cy="110" r="10" fill="#dfc8a5"/>
  <circle cx="400" cy="290" r="10" fill="#dfc8a5"/>
  <circle cx="310" cy="200" r="10" fill="#dfc8a5"/>
  <circle cx="490" cy="200" r="10" fill="#dfc8a5"/>
