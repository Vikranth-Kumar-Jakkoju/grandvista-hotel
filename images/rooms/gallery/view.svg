<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="viewBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a22"/>
      <stop offset="50%" stop-color="#222b38"/>
      <stop offset="100%" stop-color="#342d24"/>
    </linearGradient>
    <linearGradient id="windowFrame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2723"/>
      <stop offset="50%" stop-color="#3d372f"/>
      <stop offset="100%" stop-color="#22201d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#viewBg)"/>

  <!-- Golden hour sun and ambient horizon glow -->
  <circle cx="500" cy="200" r="140" fill="#dfc08f" opacity="0.25"/>
  <ellipse cx="400" cy="330" rx="380" ry="60" fill="#dfc08f" opacity="0.12"/>

  <!-- City Skyline / Monument Silhouettes -->
  <rect x="80" y="220" width="45" height="120" fill="#161b22"/>
  <polygon points="102,180 80,220 125,220" fill="#161b22"/>
  <rect x="150" y="240" width="55" height="100" fill="#1b212b"/>
  <rect x="230" y="190" width="40" height="150" fill="#161b22"/>
  <rect x="300" y="220" width="70" height="120" fill="#1b212b"/>
  <rect x="400" y="160" width="50" height="180" fill="#161b22"/>
  <polygon points="425,120 400,160 450,160" fill="#161b22"/>
  <rect x="480" y="200" width="60" height="140" fill="#1b212b"/>
  <rect x="570" y="170" width="45" height="170" fill="#161b22"/>
  <rect x="640" y="210" width="80" height="130" fill="#1b212b"/>

  <!-- Architectural Floor-to-Ceiling Window Frame -->
  <rect x="40" y="30" width="720" height="420" rx="4" fill="none" stroke="url(#windowFrame)" stroke-width="18"/>
  <line x1="280" y1="30" x2="280" y2="450" stroke="url(#windowFrame)" stroke-width="12"/>
  <line x1="520" y1="30" x2="520" y2="450" stroke="url(#windowFrame)" stroke-width="12"/>

  <!-- Room Interior Foreground Edge -->
  <rect x="0" y="440" width="800" height="60" fill="#121316"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#aa771c" stroke-width="2"/>

  <!-- Badge / Caption overlay -->
  <rect x="40" y="40" width="180" height="34" rx="17" fill="#1b1c1e" opacity="0.9" stroke="#c5a880" stroke-width="1"/>
  <text x="130" y="62" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f3e5ab" text-anchor="middle" letter-spacing="1.5">ROOM PANORAMA</text>
  <text x="40" y="475" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="#ffffff">Floor-to-Ceiling Panoramic Window</text>
</svg>
