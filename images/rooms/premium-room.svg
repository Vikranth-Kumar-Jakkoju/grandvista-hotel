<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211d"/>
      <stop offset="60%" stop-color="#2d2922"/>
      <stop offset="100%" stop-color="#191714"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#aa771c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  
  <!-- Floor -->
  <polygon points="0,380 800,380 800,500 0,500" fill="#1b1712"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#524430" stroke-width="1.5" opacity="0.6"/>

  <!-- Balcony Door / Garden View -->
  <rect x="80" y="60" width="240" height="290" rx="4" fill="#1a2521" stroke="#3d372c" stroke-width="3"/>
  <path d="M90,320 Q120,240 150,320 Q180,210 220,320 Q260,250 300,320" fill="#2d4a3b" opacity="0.6"/>
  <circle cx="160" cy="150" r="28" fill="#f4ebd9" opacity="0.15"/>
  <line x1="200" y1="60" x2="200" y2="350" stroke="#3d372c" stroke-width="3"/>

  <!-- Bathtub & Lounge Elements -->
  <!-- King Bed -->
  <rect x="380" y="160" width="340" height="180" rx="8" fill="#292621" stroke="#5a4d3a" stroke-width="2"/>
  <rect x="400" y="260" width="300" height="130" rx="4" fill="#38332b"/>
  <path d="M400,290 C400,280 410,275 430,275 L670,275 C690,275 700,280 700,290 L700,380 L400,380 Z" fill="#efebe2"/>
  <path d="M400,320 Q550,305 700,320 L700,380 L400,380 Z" fill="#d8cfbe"/>
  <!-- Pillows -->
  <rect x="430" y="235" width="105" height="42" rx="6" fill="#faf7f0" stroke="#d5cebf" stroke-width="1"/>
  <rect x="565" y="235" width="105" height="42" rx="6" fill="#faf7f0" stroke="#d5cebf" stroke-width="1"/>

  <!-- Warm ambient light & artwork -->
  <rect x="460" y="80" width="180" height="65" rx="4" fill="#1e1c18" stroke="#aa771c" stroke-width="1.5"/>
  <path d="M480,120 L510,95 L540,120 L580,90 L620,120" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Overlay Badge -->
  <rect x="40" y="40" width="180" height="34" rx="17" fill="#1b1c1e" opacity="0.9" stroke="#c5a880" stroke-width="1"/>
  <text x="130" y="62" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f3e5ab" text-anchor="middle" letter-spacing="1.5">PREMIUM ROOM</text>
  
  <text x="40" y="450" font-family="'Playfair Display', serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1">Premium Room</text>
  <text x="40" y="475" font-family="'Inter', sans-serif" font-size="14" fill="#c5a880">Garden View • Balcony &amp; Bathtub • 460 sq ft</text>
</svg>
