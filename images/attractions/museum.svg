<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="musGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1c20"/>
      <stop offset="100%" stop-color="#2c2a26"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#musGrad)"/>
  <!-- Neoclassical Museum Pediment & Columns -->
  <polygon points="120,200 400,100 680,200" fill="#24221e" stroke="#c5a880" stroke-width="2"/>
  <rect x="140" y="200" width="520" height="24" fill="#c5a880"/>
  <!-- Columns -->
  <rect x="180" y="224" width="36" height="200" fill="#2f2d29" stroke="#c5a880" stroke-width="1.5"/>
  <rect x="270" y="224" width="36" height="200" fill="#2f2d29" stroke="#c5a880" stroke-width="1.5"/>
  <rect x="360" y="224" width="36" height="200" fill="#2f2d29" stroke="#c5a880" stroke-width="1.5"/>
  <rect x="450" y="224" width="36" height="200" fill="#2f2d29" stroke="#c5a880" stroke-width="1.5"/>
  <rect x="540" y="224" width="36" height="200" fill="#2f2d29" stroke="#c5a880" stroke-width="1.5"/>
  <!-- Base steps -->
  <rect x="100" y="424" width="600" height="16" fill="#c5a880"/>
  <rect x="70" y="440" width="660" height="20" fill="#24221e"/>
  <!-- Distance Badge -->
  <rect x="32" y="32" width="130" height="32" rx="16" fill="#18191c" stroke="#c5a880" stroke-width="1"/>
  <text x="97" y="53" fill="#c5a880" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">3.8 KM AWAY</text>
  <text x="400" y="485" fill="#ffffff" font-family="'Playfair Display', serif" font-size="26" font-weight="600" text-anchor="middle">National Heritage Museum &amp; Gallery</text>
</svg>
