<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gardenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14241d"/>
      <stop offset="50%" stop-color="#1b3b2c"/>
      <stop offset="100%" stop-color="#2c5c45"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#gardenGrad)"/>
  <!-- Victorian Glasshouse Conservatory Dome -->
  <path d="M220,500 L220,280 C220,130 580,130 580,280 L580,500 Z" fill="#13241b" stroke="#c5a880" stroke-width="2"/>
  <path d="M280,500 L280,300 C280,180 520,180 520,300 L520,500 Z" fill="#204031" stroke="#c5a880" stroke-width="1.5" opacity="0.6"/>
  <!-- Glass Ribs -->
  <line x1="400" y1="140" x2="400" y2="500" stroke="#c5a880" stroke-width="2"/>
  <line x1="330" y1="180" x2="330" y2="500" stroke="#c5a880" stroke-width="1.5"/>
  <line x1="470" y1="180" x2="470" y2="500" stroke="#c5a880" stroke-width="1.5"/>
  <!-- Foliage / Flora shapes -->
  <circle cx="150" cy="460" r="90" fill="#0f1a14"/>
  <circle cx="650" cy="460" r="90" fill="#0f1a14"/>
  <circle cx="200" cy="480" r="80" fill="#1b3b2c"/>
  <circle cx="600" cy="480" r="80" fill="#1b3b2c"/>
  <!-- Distance Badge -->
  <rect x="32" y="32" width="130" height="32" rx="16" fill="#18191c" stroke="#c5a880" stroke-width="1"/>
  <text x="97" y="53" fill="#c5a880" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">2.0 KM AWAY</text>
  <text x="400" y="470" fill="#ffffff" font-family="'Playfair Display', serif" font-size="26" font-weight="600" text-anchor="middle">Royal Victorian Botanical Gardens</text>
</svg>
