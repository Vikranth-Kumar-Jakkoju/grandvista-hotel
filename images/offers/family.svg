<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="familyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142825"/>
      <stop offset="60%" stop-color="#1c3b37"/>
      <stop offset="100%" stop-color="#0c1816"/>
    </linearGradient>
    <linearGradient id="emeraldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#familyBg)"/>
  <circle cx="400" cy="180" r="170" fill="url(#emeraldGlow)"/>

  <!-- Border decor -->
  <rect x="50" y="50" width="700" height="400" rx="8" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.6"/>
  <rect x="65" y="65" width="670" height="370" rx="4" fill="none" stroke="url(#gold)" stroke-width="0.6" stroke-dasharray="6,4" opacity="0.8"/>

  <!-- Family Figures Icon -->
  <circle cx="360" cy="160" r="14" fill="url(#gold)"/>
  <path d="M340 215 C340 185 380 185 380 215 Z" fill="url(#gold)"/>
  
  <circle cx="440" cy="160" r="14" fill="url(#gold)"/>
  <path d="M420 215 C420 185 460 185 460 215 Z" fill="url(#gold)"/>

  <circle cx="400" cy="180" r="10" fill="url(#emeraldGold)"/>
  <path d="M385 220 C385 198 415 198 415 220 Z" fill="url(#emeraldGold)"/>

  <text x="400" y="315" fill="url(#gold)" font-family="serif" font-size="32" font-weight="700" letter-spacing="4" text-anchor="middle">FAMILY MEMORIES ESCAPE</text>
  <text x="400" y="352" fill="#d1fae5" font-family="sans-serif" font-size="14" letter-spacing="3" text-anchor="middle">KIDS STAY &amp; DINE FREE + 2ND ROOM 50% OFF</text>
  <rect x="310" y="375" width="180" height="28" rx="14" fill="url(#emeraldGold)"/>
  <text x="400" y="394" fill="#064e3b" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">FAMILY SUITE PACKAGE</text>
