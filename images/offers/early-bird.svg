<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="earlyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="60%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#earlyBg)"/>
  <circle cx="400" cy="180" r="170" fill="url(#sun)"/>

  <!-- Border decor -->
  <rect x="50" y="50" width="700" height="400" rx="8" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.5"/>
  <rect x="65" y="65" width="670" height="370" rx="4" fill="none" stroke="url(#gold)" stroke-width="0.6" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Calendar / Clock Early Bird Icon -->
  <rect x="350" y="140" width="100" height="90" rx="8" fill="#1c1917" stroke="url(#gold)" stroke-width="2.5"/>
  <path d="M350 170 L450 170" stroke="url(#gold)" stroke-width="2"/>
  <rect x="370" y="130" width="10" height="18" rx="2" fill="url(#gold)"/>
  <rect x="420" y="130" width="10" height="18" rx="2" fill="url(#gold)"/>
  <!-- Checkmark in calendar -->
  <path d="M380 200 L395 215 L425 185" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="400" y="315" fill="url(#gold)" font-family="serif" font-size="32" font-weight="700" letter-spacing="4" text-anchor="middle">EARLY BIRD PRIVILEGE</text>
  <text x="400" y="352" fill="#d6d3d1" font-family="sans-serif" font-size="14" letter-spacing="3" text-anchor="middle">RESERVE 30+ DAYS IN ADVANCE</text>
  <rect x="325" y="375" width="150" height="28" rx="14" fill="url(#gold)"/>
  <text x="400" y="394" fill="#1c1917" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">SAVE FLAT 20%</text>
</svg>
