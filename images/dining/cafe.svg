<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cafeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a231f"/>
      <stop offset="60%" stop-color="#382e27"/>
      <stop offset="100%" stop-color="#1d1613"/>
    </linearGradient>
    <linearGradient id="marble" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eae6df"/>
      <stop offset="50%" stop-color="#f5f3ef"/>
      <stop offset="100%" stop-color="#ded8cc"/>
    </linearGradient>
    <linearGradient id="warmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6cca9"/>
      <stop offset="50%" stop-color="#c5a880"/>
      <stop offset="100%" stop-color="#997b53"/>
    </linearGradient>
    <linearGradient id="woodPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="100%" stop-color="#2e2016"/>
    </linearGradient>
  </defs>

  <!-- Background wall -->
  <rect width="800" height="500" fill="url(#cafeBg)"/>

  <!-- Subway tiles pattern hint -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="110" x2="800" y2="110"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
  </g>

  <!-- Shelves with Coffee Jars & Syrups -->
  <rect x="120" y="110" width="560" height="8" fill="url(#warmGold)"/>
  <rect x="160" y="70" width="28" height="40" rx="3" fill="#dfc8a5" opacity="0.6"/>
  <rect x="200" y="65" width="24" height="45" rx="3" fill="#d97706" opacity="0.7"/>
  <rect x="235" y="75" width="30" height="35" rx="3" fill="#78350f" opacity="0.8"/>
  <rect x="520" y="68" width="34" height="42" rx="3" fill="#dfc8a5" opacity="0.7"/>
  <rect x="565" y="62" width="22" height="48" rx="3" fill="#b45309" opacity="0.8"/>
  <rect x="598" y="72" width="32" height="38" rx="3" fill="#dfc8a5" opacity="0.6"/>

  <!-- Hanging Pendant Brass Lamps -->
  <line x1="280" y1="0" x2="280" y2="150" stroke="url(#warmGold)" stroke-width="2"/>
  <path d="M260 170 Q280 150 300 170 Z" fill="url(#warmGold)"/>
  <circle cx="280" cy="174" r="6" fill="#fffbeb"/>
  <circle cx="280" cy="185" r="22" fill="#fffbeb" opacity="0.15"/>

  <line x1="520" y1="0" x2="520" y2="150" stroke="url(#warmGold)" stroke-width="2"/>
  <path d="M500 170 Q520 150 540 170 Z" fill="url(#warmGold)"/>
  <circle cx="520" cy="174" r="6" fill="#fffbeb"/>
  <circle cx="520" cy="185" r="22" fill="#fffbeb" opacity="0.15"/>

  <!-- Bakery & Coffee Counter -->
  <polygon points="0,320 800,320 800,500 0,500" fill="url(#woodPanel)"/>
  <!-- Marble Countertop -->
  <polygon points="0,295 800,295 800,320 0,320" fill="url(#marble)"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="url(#warmGold)" stroke-width="2"/>

  <!-- Espresso Machine (Chrome & Brass) -->
  <rect x="150" y="210" width="130" height="85" rx="5" fill="#52525b" stroke="#71717a" stroke-width="2"/>
  <rect x="160" y="220" width="110" height="20" rx="3" fill="#27272a"/>
  <circle cx="180" cy="230" r="5" fill="#22c55e"/>
  <circle cx="200" cy="230" r="5" fill="#eab308"/>
  <circle cx="220" cy="230" r="5" fill="#ef4444"/>
  <!-- Group heads -->
  <rect x="185" y="245" width="18" height="22" fill="url(#warmGold)"/>
  <rect x="225" y="245" width="18" height="22" fill="url(#warmGold)"/>

  <!-- Glass Pastry Display Case -->
  <rect x="460" y="215" width="220" height="80" rx="4" fill="rgba(255,255,255,0.08)" stroke="url(#warmGold)" stroke-width="2"/>
  <line x1="460" y1="255" x2="680" y2="255" stroke="url(#warmGold)" stroke-width="1.5"/>
  <!-- Pastries / Croissants / Macarons inside -->
  <path d="M480 250 Q495 240 510 250 Z" fill="#d97706"/>
  <path d="M525 250 Q540 240 555 250 Z" fill="#d97706"/>
  <circle cx="580" cy="247" r="7" fill="#f43f5e"/>
  <circle cx="600" cy="247" r="7" fill="#10b981"/>
  <circle cx="620" cy="247" r="7" fill="#fbbf24"/>
  <circle cx="640" cy="247" r="7" fill="#8b5cf6"/>

  <path d="M490 290 Q510 278 530 290 Z" fill="#b45309"/>
  <path d="M545 290 Q565 278 585 290 Z" fill="#b45309"/>
  <path d="M605 290 Q625 278 645 290 Z" fill="#b45309"/>

  <!-- Artisan Coffee Cup & Saucer Foreground -->
  <ellipse cx="360" cy="315" rx="36" ry="12" fill="#e2dcd2" stroke="#bbb" stroke-width="1"/>
  <ellipse cx="360" cy="308" rx="24" ry="10" fill="#ffffff" stroke="url(#warmGold)" stroke-width="1"/>
  <ellipse cx="360" cy="308" rx="20" ry="7" fill="#451a03"/>
  <!-- Latte Art Rosetta -->
  <path d="M355 308 Q360 304 365 308 Q360 312 355 308" fill="#fffbeb"/>
  <!-- Steam curls -->
  <path d="M356 295 Q352 285 358 275" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M365 293 Q368 283 363 273" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Branding Text on Wood Apron -->
  <text x="400" y="440" fill="url(#warmGold)" font-family="serif" font-size="20" letter-spacing="4" text-anchor="middle" font-weight="600">THE GRAND CAFÉ</text>
  <text x="400" y="468" fill="#a89b88" font-family="sans-serif" font-size="12" letter-spacing="2" text-anchor="middle">ARTISANAL BAKERY &amp; SPECIALTY ROASTS</text>
</svg>
