<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="heroLight" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3d3326" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#24211d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="warmGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#121316" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#121316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#heroLight)"/>
  
  <!-- Subtle luxury architectural arches in background -->
  <g stroke="#aa771c" stroke-width="1.5" opacity="0.15" fill="none">
    <path d="M 360 1080 L 360 400 A 300 300 0 0 1 960 400 L 960 1080"/>
    <path d="M 960 1080 L 960 400 A 300 300 0 0 1 1560 400 L 1560 1080"/>
    <path d="M 660 1080 L 660 300 A 300 300 0 0 1 1260 300 L 1260 1080"/>
  </g>
  
  <!-- Subtle ambient particles / warm sparkles -->
  <g fill="#dfc08f" opacity="0.3">
    <circle cx="450" cy="380" r="3"/>
    <circle cx="820" cy="240" r="2.5"/>
    <circle cx="1150" cy="310" r="3.5"/>
    <circle cx="1400" cy="420" r="2"/>
    <circle cx="680" cy="500" r="2.5"/>
    <circle cx="980" cy="460" r="3"/>
    <circle cx="1250" cy="550" r="2"/>
  </g>

  <!-- Darkening overlay for maximum text contrast -->
  <rect width="1920" height="1080" fill="url(#warmGlow)"/>
</svg>
