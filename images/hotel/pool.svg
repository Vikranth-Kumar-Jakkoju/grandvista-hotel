<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="poolSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c26"/>
      <stop offset="60%" stop-color="#243345"/>
      <stop offset="100%" stop-color="#3c372f"/>
    </linearGradient>
    <linearGradient id="poolWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b4d66"/>
      <stop offset="50%" stop-color="#103c54"/>
      <stop offset="100%" stop-color="#0a2536"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#poolSky)"/>

  <!-- Golden hour horizon -->
  <circle cx="500" cy="220" r="140" fill="#dfc08f" opacity="0.2"/>

  <!-- Distant Skyline Silhouettes -->
  <rect x="80" y="160" width="40" height="110" fill="#131b24" opacity="0.8"/>
  <rect x="130" y="130" width="50" height="140" fill="#18232e" opacity="0.9"/>
  <rect x="190" y="180" width="35" height="90" fill="#131b24" opacity="0.8"/>
  <rect x="560" y="140" width="60" height="130" fill="#18232e" opacity="0.9"/>
  <rect x="630" y="170" width="45" height="100" fill="#131b24" opacity="0.8"/>
  <rect x="685" y="120" width="55" height="150" fill="#18232e" opacity="0.9"/>

  <!-- Infinity Pool Edge & Water -->
  <polygon points="60,270 740,270 790,500 10,500" fill="url(#poolWater)"/>
  
  <!-- Subtle water ripples -->
  <ellipse cx="400" cy="340" rx="260" ry="14" fill="none" stroke="#488ca8" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="400" cy="390" rx="320" ry="18" fill="none" stroke="#488ca8" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="400" cy="445" rx="360" ry="22" fill="none" stroke="#488ca8" stroke-width="1.5" opacity="0.4"/>

  <!-- Glass Infinity Edge Railing -->
  <line x1="60" y1="270" x2="740" y2="270" stroke="#c5a880" stroke-width="2"/>
  <rect x="50" y="240" width="700" height="30" fill="#323b47" opacity="0.3" stroke="#aa771c" stroke-width="1"/>

  <!-- Poolside Luxury Sunbeds -->
  <rect x="80" y="380" width="100" height="40" rx="4" fill="#2d2822" stroke="#aa771c" stroke-width="1.5"/>
  <rect x="85" y="375" width="40" height="15" rx="3" fill="#eae4d7"/>
  <rect x="620" y="380" width="100" height="40" rx="4" fill="#2d2822" stroke="#aa771c" stroke-width="1.5"/>
  <rect x="675" y="375" width="40" height="15" rx="3" fill="#eae4d7"/>

  <!-- Badge / Caption Overlay -->
  <rect x="40" y="40" width="160" height="34" rx="17" fill="#18191c" opacity="0.9" stroke="#c5a880" stroke-width="1"/>
  <text x="120" y="62" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f5e6b3" text-anchor="middle" letter-spacing="1.5">INFINITY POOL</text>
  <text x="40" y="450" font-family="'Playfair Display', serif" font-size="28" font-weight="700" fill="#ffffff">Rooftop Heated Infinity Pool</text>
  <text x="40" y="475" font-family="'Inter', sans-serif" font-size="14" fill="#c5a880">Panoramic capital views, sunset cocktail service &amp; private cabanas</text>
</svg>
